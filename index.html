<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hebrew">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<title>Hebrew</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #efece4;
    --text: #1d1f23;
    --muted: #6b6f78;
    --line: #e2ded4;
    --accent: #1f5fbf;
    --accent-soft: #e3ecfa;
    --good: #1f8a4c;
    --good-soft: #e1f3e8;
    --warn: #b86a00;
    --warn-soft: #fbefdc;
    --bad: #c23b3b;
    --bad-soft: #f8e2e2;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
    --radius: 18px;
    --he: "Frank Ruhl Libre", "Times New Roman", serif;
    --ui: "Rubik", -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1e2127;
      --surface-2: #272b33;
      --text: #eceef2;
      --muted: #9aa0ab;
      --line: #2f343d;
      --accent: #6aa2ff;
      --accent-soft: #1d2b44;
      --good: #4cc27f;
      --good-soft: #17301f;
      --warn: #f0a640;
      --warn-soft: #362812;
      --bad: #f07272;
      --bad-soft: #3a1c1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.4;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  select { font: inherit; color: inherit; }

  .he { font-family: var(--he); direction: rtl; unicode-bidi: isolate; }

  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; }
  .title { font-weight: 600; font-size: 19px; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
  .title .he { font-size: 24px; font-weight: 700; color: var(--accent); }
  .controls { display: flex; gap: 8px; max-width: 640px; margin: 10px auto 0; }
  .pill {
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 8px 14px; font-size: 14px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  select.pill { appearance: none; -webkit-appearance: none; padding-right: 30px; flex: 1; min-width: 0;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
    background-size: 5px 5px; background-repeat: no-repeat; }
  .pill[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  main {
    max-width: 640px; margin: 0 auto;
    padding: 16px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 16px);
  }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 6px calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 8px);
  }
  nav.tabs .inner { display: flex; width: 100%; max-width: 640px; }
  nav.tabs button {
    flex: 1; border: 0; background: none; padding: 8px 4px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; color: var(--muted); border-radius: 12px;
  }
  nav.tabs button .ico { font-size: 20px; line-height: 1; }
  nav.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 500; }

  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .spacer { flex: 1; }

  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 14px;
    padding: 14px 16px; font-weight: 500; font-size: 16px;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .btn.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .btn.ghost { background: none; }
  .btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 12px; }
  .hear { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px; }

  /* Cards */
  .deck-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
  .flash {
    min-height: 300px; padding: 24px 20px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    user-select: none; -webkit-user-select: none;
  }
  .flash .big { font-size: 64px; line-height: 1.2; font-weight: 500; }
  .flash .pron { font-size: 22px; font-weight: 500; letter-spacing: .3px; }
  .flash .mean { font-size: 22px; }
  .flash .note { font-size: 15px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; max-width: 420px; }
  .flash .hint { font-size: 13px; }
  .status-tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; }
  .status-tag.known { background: var(--good-soft); color: var(--good); }
  .status-tag.learning { background: var(--warn-soft); color: var(--warn); }
  .answer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .done { padding: 32px 20px; text-align: center; }
  .done h2 { margin: 0 0 6px; font-size: 22px; }
  .done .stats { display: flex; justify-content: center; gap: 18px; margin: 14px 0 20px; }
  .done .stats b { display: block; font-size: 28px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 500; }

  /* Sentences */
  .sent { padding: 16px 18px; margin-bottom: 12px; }
  .sent .he-line { font-size: 30px; line-height: 1.45; text-align: right; }
  .sent .reveal { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
  .sent .pron { font-weight: 500; }
  .sent .new { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--text); border-radius: 10px; padding: 5px 10px; font-size: 14px; }
  .chip .he { font-size: 18px; color: var(--accent); }
  .tap-hint { font-size: 13px; color: var(--muted); }

  /* Quiz */
  .quiz-q { padding: 26px 20px; text-align: center; margin-bottom: 14px; }
  .quiz-q .prompt-he { font-size: 56px; line-height: 1.2; }
  .quiz-q .prompt-en { font-size: 28px; font-weight: 500; }
  .opts { display: grid; gap: 10px; }
  .opt {
    text-align: center; border: 1px solid var(--line); background: var(--surface);
    border-radius: 14px; padding: 14px; font-size: 18px; box-shadow: var(--shadow);
  }
  .opt.he-opt { font-family: var(--he); font-size: 30px; padding: 10px; direction: rtl; }
  .opt.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .opt:disabled { cursor: default; }
  .feedback { text-align: center; margin: 14px 0 6px; min-height: 24px; }

  /* Word list */
  .group-title { font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 18px 4px 8px; }
  .group-title:first-child { margin-top: 0; }
  .wl { overflow: hidden; }
  .wl-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .wl-item:first-child { border-top: 0; }
  .wl-item .he { font-size: 28px; min-width: 88px; text-align: right; }
  .wl-item .info { flex: 1; min-width: 0; }
  .wl-item .info .m { font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.known { background: var(--good); }
  .dot.learning { background: var(--warn); }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 0 4px 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* Letter breakdown */
  .letters { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; direction: rtl; }
  .ltile {
    display: flex; flex-direction: column; align-items: center; min-width: 62px;
    background: var(--surface-2); border-radius: 12px; padding: 6px 6px 7px; direction: ltr;
  }
  .ltile .he { font-size: 34px; line-height: 1.25; color: var(--accent); }
  .ltile .ln { font-size: 13px; font-weight: 500; }
  .ltile .ls { font-size: 12px; color: var(--muted); }
  .wl-item.open { background: var(--surface-2); }
  .wl-letters { padding: 4px 14px 14px; background: var(--surface-2); }
  .wl-letters .ltile { background: var(--surface); }
  .wl-item { cursor: pointer; }

  /* Alef-Bet */
  .ab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; direction: rtl; }
  .ab-tile {
    display: flex; flex-direction: column; align-items: center; direction: ltr;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 4px 8px;
    box-shadow: var(--shadow);
  }
  .ab-tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .ab-tile .he { font-size: 40px; line-height: 1.2; }
  .ab-tile .ln { font-size: 13px; font-weight: 500; }
  .ab-tile .ls { font-size: 12px; color: var(--muted); }
  .ab-detail { padding: 18px; margin-bottom: 14px; text-align: center; }
  .ab-detail .big { font-size: 80px; line-height: 1.1; color: var(--accent); }
  .ab-detail .name { font-size: 22px; font-weight: 600; }
  .ab-detail .snd { font-size: 17px; margin: 2px 0 8px; }
  .ab-detail .tip { font-size: 15px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 10px auto 0; max-width: 440px; }
  .ab-ex { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
  .ab-ex .chip { cursor: pointer; }
  .look { padding: 4px 0; }
  .look .wl-item .he { min-width: 0; font-size: 34px; letter-spacing: 8px; }
  .vowel-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .vowel-row:first-child { border-top: 0; }
  .vowel-row .he { font-size: 44px; min-width: 64px; text-align: center; color: var(--accent); }
  .vowel-row .info { flex: 1; }
  .callout { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 84px);
    background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px;
    font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .empty { text-align: center; padding: 40px 20px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title"><span class="he" lang="he">עִבְרִית</span> Hebrew <span class="small muted" id="version" style="font-weight:400"></span></div>
    <button class="pill" id="vowelBtn" aria-pressed="true">Vowel marks</button>
  </div>
  <div class="controls">
    <select class="pill" id="setSelect" aria-label="Which set to study"></select>
  </div>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <div class="inner" role="tablist">
    <button role="tab" data-tab="cards"><span class="ico">🃏</span>Cards</button>
    <button role="tab" data-tab="sentences"><span class="ico">💬</span>Sentences</button>
    <button role="tab" data-tab="quiz"><span class="ico">✅</span>Quiz</button>
    <button role="tab" data-tab="words"><span class="ico">📖</span>All words</button>
    <button role="tab" data-tab="alefbet"><span class="ico he" lang="he" style="font-weight:700">אב</span>Alef-Bet</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ============================================================
// CONTENT: add a new set at the end each week.
// Never change existing set ids or word ids (progress is keyed on them).
// word:     { id, he, pron, mean, note? }
// sentence: { he, pron, mean, new?: [{ he, pron, mean }] }
// ============================================================
const CONTENT = [
  {
    id: "set-01",
    label: "Week 1",
    words: [
      { id: "w01", he: "שָׁלוֹם", pron: "sha-LOM", mean: "hello / goodbye / peace", note: "The dot on the top right of שׁ makes it \"sh.\"" },
      { id: "w02", he: "תּוֹדָה", pron: "to-DA", mean: "thank you", note: "ת always sounds like \"t,\" with or without the dot inside." },
      { id: "w03", he: "בַּיִת", pron: "BA-yit", mean: "house, home", note: "The dot inside בּ makes it \"b.\" Without the dot, ב is \"v.\"" },
      { id: "w04", he: "מַיִם", pron: "MA-yim", mean: "water", note: "Water is always plural in Hebrew. There's no \"one water.\"" },
      { id: "w05", he: "לֶחֶם", pron: "LE-chem", mean: "bread", note: "ח is the throaty \"ch\" sound, like in \"Bach.\"" },
      { id: "w06", he: "סֵפֶר", pron: "SE-fer", mean: "book", note: "פ without a dot is \"f.\" With a dot (פּ) it's \"p.\"" },
      { id: "w07", he: "יֶלֶד", pron: "YE-led", mean: "boy, child" },
      { id: "w08", he: "אִמָּא", pron: "I-ma", mean: "mom", note: "א makes no sound of its own. It just holds the vowel." },
      { id: "w09", he: "אַבָּא", pron: "A-ba", mean: "dad" },
      { id: "w10", he: "כֶּלֶב", pron: "KE-lev", mean: "dog", note: "כּ with a dot is \"k.\" The ב at the end has no dot, so it's \"v.\"" }
    ],
    sentences: [
      { he: "זֶה כֶּלֶב.", pron: "ze KE-lev.", mean: "This is a dog.",
        new: [{ he: "זֶה", pron: "ze", mean: "this (is)" }] },
      { he: "זֶה הַבַּיִת.", pron: "ze ha-BA-yit.", mean: "This is the house.",
        new: [{ he: "זֶה", pron: "ze", mean: "this (is)" }, { he: "הַ", pron: "ha", mean: "the" }] },
      { he: "שָׁלוֹם, אִמָּא!", pron: "sha-LOM, I-ma!", mean: "Hi, Mom!" },
      { he: "תּוֹדָה, אַבָּא!", pron: "to-DA, A-ba!", mean: "Thanks, Dad!" },
      { he: "יֵשׁ לֶחֶם.", pron: "yesh LE-chem.", mean: "There is bread.",
        new: [{ he: "יֵשׁ", pron: "yesh", mean: "there is" }] },
      { he: "יֵשׁ מַיִם בַּבַּיִת.", pron: "yesh MA-yim ba-BA-yit.", mean: "There is water in the house.",
        new: [{ he: "יֵשׁ", pron: "yesh", mean: "there is" }, { he: "בַּ", pron: "ba", mean: "in the" }] },
      { he: "הַיֶּלֶד קוֹרֵא סֵפֶר.", pron: "ha-YE-led ko-RE SE-fer.", mean: "The boy reads a book.",
        new: [{ he: "הַ", pron: "ha", mean: "the" }, { he: "קוֹרֵא", pron: "ko-RE", mean: "reads (he)" }] },
      { he: "הַכֶּלֶב שׁוֹתֶה מַיִם.", pron: "ha-KE-lev sho-TE MA-yim.", mean: "The dog drinks water.",
        new: [{ he: "הַ", pron: "ha", mean: "the" }, { he: "שׁוֹתֶה", pron: "sho-TE", mean: "drinks (he)" }] },
      { he: "אִמָּא אוֹכֶלֶת לֶחֶם.", pron: "I-ma o-CHE-let LE-chem.", mean: "Mom eats bread.",
        new: [{ he: "אוֹכֶלֶת", pron: "o-CHE-let", mean: "eats (she)" }] },
      { he: "אַבָּא קוֹרֵא סֵפֶר בַּבַּיִת.", pron: "A-ba ko-RE SE-fer ba-BA-yit.", mean: "Dad reads a book at home.",
        new: [{ he: "קוֹרֵא", pron: "ko-RE", mean: "reads (he)" }, { he: "בַּ", pron: "ba", mean: "in the" }] }
    ]
  },
  {
    id: "set-02",
    label: "Week 2",
    words: [
      { id: "w01", he: "יַלְדָּה", pron: "yal-DA", mean: "girl", note: "Add ה to the end of יֶלֶד (boy) and you get \"girl.\" The dot inside the ד is a dagesh, not a vowel. It doesn't change the \"d\" sound." },
      { id: "w02", he: "אִישׁ", pron: "ish", mean: "man", note: "The י makes no sound here. It just stretches the \"i.\"" },
      { id: "w03", he: "אִשָּׁה", pron: "i-SHA", mean: "woman" },
      { id: "w04", he: "חָתוּל", pron: "cha-TUL", mean: "cat", note: "A ו with a dot in its middle (וּ) sounds like \"u.\"" },
      { id: "w05", he: "חָלָב", pron: "cha-LAV", mean: "milk", note: "No dot in the ב at the end, so it's \"v.\"" },
      { id: "w06", he: "גָּדוֹל", pron: "ga-DOL", mean: "big" },
      { id: "w07", he: "קָטָן", pron: "ka-TAN", mean: "small", note: "ן is how נ looks at the end of a word." },
      { id: "w08", he: "טוֹב", pron: "tov", mean: "good", note: "ט and ת both sound like \"t.\"" },
      { id: "w09", he: "כֵּן", pron: "ken", mean: "yes" },
      { id: "w10", he: "לֹא", pron: "lo", mean: "no, not", note: "The dot above the ל gives it the \"o\" sound. The א is silent." }
    ],
    sentences: [
      { he: "זֶה חָתוּל.", pron: "ze cha-TUL.", mean: "This is a cat.",
        new: [{ he: "זֶה", pron: "ze", mean: "this (is)" }] },
      { he: "הַכֶּלֶב גָּדוֹל.", pron: "ha-KE-lev ga-DOL.", mean: "The dog is big.",
        new: [{ he: "הַ", pron: "ha", mean: "the" }] },
      { he: "הַחָתוּל קָטָן.", pron: "ha-cha-TUL ka-TAN.", mean: "The cat is small.",
        new: [{ he: "הַ", pron: "ha", mean: "the" }] },
      { he: "הַיַּלְדָּה שׁוֹתָה חָלָב.", pron: "ha-yal-DA sho-TA cha-LAV.", mean: "The girl drinks milk.",
        new: [{ he: "הַ", pron: "ha", mean: "the" }, { he: "שׁוֹתָה", pron: "sho-TA", mean: "drinks (she)" }] },
      { he: "הָאִישׁ קוֹרֵא סֵפֶר.", pron: "ha-ISH ko-RE SE-fer.", mean: "The man reads a book.",
        new: [{ he: "הָ", pron: "ha", mean: "the (spelled הָ before א)" }, { he: "קוֹרֵא", pron: "ko-RE", mean: "reads (he)" }] },

// App

// Bump on every push so we can tell from the header which version a phone has.
const APP_VERSION = "v9 · Nov 2";
document.getElementById("version").textContent = APP_VERSION;

const STORE_KEY = "hebrew-flashcards-v1";
const ALL = "all";

const defaults = { progress: {}, best: {}, vowels: true, set: CONTENT[CONTENT.length - 1].id, tab: "cards", quizDir: "he-en", cardFilter: "all" };
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    const merged = Object.assign({}, defaults, s);
    if (merged.set !== ALL && !CONTENT.some(c => c.id === merged.set)) merged.set = defaults.set;
    return merged;
  } catch (e) { return Object.assign({}, defaults); }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

// Strip nikkud and cantillation (U+0591–U+05C7) but keep the maqaf (U+05BE).
function stripNikkud(s) { return s.replace(/[֑-ֽֿ-ׇ]/g, ""); }
function heb(s) { return state.vowels ? s : stripNikkud(s); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function heSpan(s, cls = "") { return `<span class="he ${cls}" lang="he" dir="rtl">${esc(heb(s))}</span>`; }

function key(setId, wordId) { return setId + ":" + wordId; }
function statusOf(w) { return state.progress[key(w.setId, w.id)]; }
function setStatus(w, st) { state.progress[key(w.setId, w.id)] = st; saveState(); }

function selectedSets() { return state.set === ALL ? CONTENT : CONTENT.filter(c => c.id === state.set); }
function allWords() { return CONTENT.flatMap(c => c.words.map(w => Object.assign({ setId: c.id }, w))); }
function selectedWords() { return selectedSets().flatMap(c => c.words.map(w => Object.assign({ setId: c.id }, w))); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- Letter breakdown ----------
// Name and sound for each letter. [name, sound]; "" sound = silent.
const LETTERS = {
  "א": ["Alef", ""], "ב": ["Vet", "v"], "בּ": ["Bet", "b"], "ג": ["Gimel", "g"], "ד": ["Dalet", "d"],
  "ה": ["Hey", "h"], "ו": ["Vav", "v"], "ז": ["Zayin", "z"], "ח": ["Chet", "ch"], "ט": ["Tet", "t"],
  "י": ["Yod", "y"], "כ": ["Chaf", "ch"], "כּ": ["Kaf", "k"], "ך": ["Final Chaf", "ch"], "ךּ": ["Final Kaf", "k"],
  "ל": ["Lamed", "l"], "מ": ["Mem", "m"], "ם": ["Final Mem", "m"], "נ": ["Nun", "n"], "ן": ["Final Nun", "n"],
  "ס": ["Samech", "s"], "ע": ["Ayin", ""], "פ": ["Fe", "f"], "פּ": ["Pe", "p"], "ף": ["Final Fe", "f"],
  "צ": ["Tsadi", "ts"], "ץ": ["Final Tsadi", "ts"], "ק": ["Kuf", "k"], "ר": ["Resh", "r"],
  "ש": ["Shin", "sh"], "שׁ": ["Shin", "sh"], "שׂ": ["Sin", "s"], "ת": ["Tav", "t"], "תּ": ["Tav", "t"]
};
const VOWELS = {
  "ֱ": "e", "ֲ": "a", "ֳ": "o", "ִ": "i", "ֵ": "e", "ֶ": "e",
  "ַ": "a", "ָ": "a", "ֹ": "o", "ֺ": "o", "ֻ": "u", "ׇ": "o"
};
const DAGESH = "ּ", SHIN_DOT = "ׁ", SIN_DOT = "ׂ";

// Split a word into letters, each with its marks, and work out a name + sound.
function breakdown(word) {
  const clusters = [];
  for (const ch of word) {
    if (/[א-ת]/.test(ch)) clusters.push({ base: ch, marks: "" });
    else if (/[֑-ֽֿ-ׇ]/.test(ch) && clusters.length) clusters[clusters.length - 1].marks += ch;
  }
  return clusters.map((c, i) => {
    const m = c.marks, last = i === clusters.length - 1;
    let k = c.base;
    if (m.includes(DAGESH) && LETTERS[c.base + DAGESH]) k = c.base + DAGESH;
    if (c.base === "ש") k = m.includes(SIN_DOT) ? "שׂ" : "שׁ";
    let [name, sound] = LETTERS[k] || [c.base, ""];
    const vowel = [...m].map(x => VOWELS[x]).find(Boolean) || "";
    const prev = clusters[i - 1] ? [...clusters[i - 1].marks].map(x => VOWELS[x]).find(Boolean) : "";
    if (c.base === "ו" && m.includes("ֹ")) return { glyph: c.base + m, name: "Vav", sound: "o" };
    if (c.base === "ו" && m.includes(DAGESH) && !vowel) return { glyph: c.base + m, name: "Vav", sound: "u" };
    if (c.base === "ה" && last && !m.includes(DAGESH) && !vowel) sound = "";
    if (c.base === "י" && !vowel && (prev === "i" || prev === "e")) sound = "";
    const full = sound + vowel;
    return { glyph: c.base + m, name, sound: full || "silent" };
  });
}
function lettersHtml(word) {
  return `<div class="letters" aria-label="Letters">` + breakdown(word).map(l =>
    `<div class="ltile">${heSpan(l.glyph)}<span class="ln">${esc(l.name)}</span><span class="ls">${esc(l.sound)}</span></div>`
  ).join("") + `</div>`;
}

// ---------- Speech ----------
let heVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  heVoice = vs.find(v => /^he/i.test(v.lang)) || vs.find(v => /^iw/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
}
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("This browser can't speak."); return; }
  pickVoice();
  if (!heVoice) {
    toast("No Hebrew voice found. On iPhone: Settings › Accessibility › Spoken Content › Voices › Hebrew.");
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "he-IL";
  if (heVoice) u.voice = heVoice;
  u.rate = 0.8;
  speechSynthesis.speak(u);
}
function hearBtn(text) { return `<button class="hear" data-speak="${esc(text)}" aria-label="Hear it">🔊 Hear it</button>`; }

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

}

vowelBtn.addEventListener("click", () => { state.vowels = !state.vowels; saveState(); render(); });
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  state.tab = b.dataset.tab; saveState(); render(); window.scrollTo(0, 0);
}));

// ---------- Cards ----------
// deckMarks[i] is what was answered for card i this pass, so going back and re-answering doesn't double count.
let deck = null, deckIdx = 0, flipped = false, deckMarks = [];
function resetDeck(doShuffle = false) {
  let ws = selectedWords();
  if (state.cardFilter === "learning") ws = ws.filter(w => statusOf(w) !== "known");
  deck = doShuffle ? shuffle(ws) : ws;
  deckIdx = 0; flipped = false; deckMarks = [];
}
function deckCount(st) { return deckMarks.filter(m => m === st).length; }
const backBtn = () => `<button class="btn sm ghost" data-act="back">‹ Back</button>`;
function renderCards() {
  if (!deck) resetDeck();
  const filterSeg = `<div class="seg" role="group" aria-label="Which cards">
      <button data-filter="all" aria-pressed="${state.cardFilter === "all"}">All</button>
      <button data-filter="learning" aria-pressed="${state.cardFilter === "learning"}">Not known yet</button>
    </div>`;
  let html = `<div class="deck-head">${filterSeg}<span class="spacer"></span><button class="btn sm ghost" data-act="shuffle">🔀 Shuffle</button></div>`;

  if (deck.length === 0) {
    html += `<div class="card empty"><h2 style="margin:0 0 6px">You know them all! 🎉</h2>
      <p class="muted">Every word in this set is marked "I know it."</p>
      <button class="btn primary" data-filter="all">Review all cards</button></div>`;
    return html;
  }
  if (deckIdx >= deck.length) {
    html += `<div class="card done"><h2>Nice work! 🎉</h2><p class="muted">You went through ${deck.length} card${deck.length === 1 ? "" : "s"}.</p>
      <div class="stats"><div><b style="color:var(--good)">${deckCount("known")}</b><span class="small muted">I know it</span></div>
      <div><b style="color:var(--warn)">${deckCount("learning")}</b><span class="small muted">Still learning</span></div></div>
      <div class="row" style="justify-content:center;flex-wrap:wrap">
        <button class="btn primary" data-act="again">Go again</button>
        ${deckCount("learning") ? `<button class="btn" data-filter="learning">Just the ones I'm learning</button>` : ""}
      </div>
      <div style="margin-top:12px">${backBtn()}</div></div>`;
    return html;
  }
  const w = deck[deckIdx];
  const st = statusOf(w);
  const tag = st === "known" ? `<span class="status-tag known">Known</span>` : st === "learning" ? `<span class="status-tag learning">Learning</span>` : "";
  html += `<div class="progress"><div style="width:${(deckIdx / deck.length) * 100}%"></div></div>`;
  html += `<div class="row small muted" style="margin-bottom:8px;min-height:34px">${deckIdx > 0 ? backBtn() : ""}<span>Card ${deckIdx + 1} of ${deck.length}</span>${tag}<span class="spacer"></span><button class="btn sm ghost" data-act="forward">Next ›</button></div>`;
  html += `<div class="card flash" data-act="flip" role="button" aria-label="Flip card">
      ${heSpan(w.he, "big")}
      ${flipped
        ? `<div class="pron">${esc(w.pron)}</div><div class="mean">${esc(w.mean)}</div>${lettersHtml(w.he)}${w.note ? `<div class="note">${esc(w.note)}</div>` : ""}`
        : `<div class="hint muted">Tap to flip</div>`}
      ${hearBtn(w.he)}
    </div>`;
  html += flipped
    ? `<div class="answer-row"><button class="btn warn" data-mark="learning">Still learning</button><button class="btn good" data-mark="known">I know it</button></div>`
    : `<div class="answer-row"><button class="btn" data-act="flip" style="grid-column:1/-1">Show answer</button></div>`;
  return html;
}

// ---------- Sentences ----------
const revealed = new Set();
function renderSentences() {

// ---------- Quiz ----------
const ROUND_LEN = 15;
// round: { words, i, right, missed, practice, q: { answer, options, picked } }; q is null when the round is over.
let round = null;
function resetQuiz() { round = null; }
const sameWord = (a, b) => a.setId === b.setId && a.id === b.id;

// Pick one word, leaning toward words that aren't marked "I know it" yet.
function weightedPick(ws) {
  const weighted = ws.flatMap(w => statusOf(w) === "known" ? [w] : [w, w]);
  return weighted[Math.floor(Math.random() * weighted.length)];
}
// Every word once (up to n), then repeats to fill the round, with no word twice in a row.
function buildRound(pool, n) {
  const out = [], rest = pool.slice();
  while (out.length < n && rest.length) { const w = weightedPick(rest); out.push(w); rest.splice(rest.indexOf(w), 1); }
  while (out.length < n) out.push(weightedPick(pool));
  let words = shuffle(out);
  for (let tries = 0; tries < 200 && words.some((w, i) => i > 0 && sameWord(w, words[i - 1])); tries++) words = shuffle(out);
  return words;
}
function makeQuestion(answer) {
  let distractPool = selectedWords().filter(w => !sameWord(w, answer) && w.mean !== answer.mean);
  if (distractPool.length < 3) distractPool = allWords().filter(w => !sameWord(w, answer) && w.mean !== answer.mean);
  return { answer, options: shuffle([answer, ...shuffle(distractPool).slice(0, 3)]), picked: null };
}
function startRound(words, practice = false) {
  round = words.length ? { words, i: 0, right: 0, missed: [], practice, q: makeQuestion(words[0]) } : null;
}
function finishRound() {
  round.q = null;
  if (round.practice) return;
  state.best = state.best || {};
  const prev = state.best[state.set];
  round.newBest = prev !== undefined && round.right > prev;
  if (prev === undefined || round.right > prev) { state.best[state.set] = round.right; saveState(); }
}
function renderQuizDone() {
  const r = round, n = r.words.length, pct = r.right / n;
  const [emoji, msg] = pct === 1 ? ["🌟", "Perfect score!"] : pct >= 0.8 ? ["🎉", "Great job!"] : pct >= 0.5 ? ["👍", "Nice work!"] : ["💪", "Good practice. Keep going!"];
  const best = state.best && state.best[state.set];
  let html = `<div class="card done">
    <div style="font-size:56px;line-height:1">${emoji}</div>
    <h2 style="margin-top:10px">${msg}</h2>
    <div style="font-size:44px;font-weight:600;margin:6px 0">${r.right}<span class="muted" style="font-size:24px"> / ${n}</span></div>
    ${r.practice ? `<p class="muted small">Practice round</p>`
      : r.newBest ? `<p style="color:var(--good);font-weight:500">New best for ${esc(setName())}! 🏆</p>`
      : best !== undefined ? `<p class="muted small">Best for ${esc(setName())}: ${best} / ${ROUND_LEN}</p>` : ""}`;
  if (r.missed.length) {
    html += `<div style="text-align:left;margin:16px 0 4px" class="small muted">Words to practice:</div><div class="card wl" style="box-shadow:none;text-align:left">` +
      r.missed.map(w => `<div class="wl-item" style="cursor:default">${heSpan(w.he)}<div class="info"><div class="m">${esc(w.mean)}</div><div class="small muted">${esc(w.pron)}</div></div>
        <button class="hear" data-speak="${esc(w.he)}" aria-label="Hear ${esc(w.mean)}">🔊</button></div>`).join("") + `</div>`;
  }
  html += `<div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:18px">
      <button class="btn primary" data-act="newround">New round</button>
      ${r.missed.length ? `<button class="btn" data-act="practice">Practice missed (${r.missed.length})</button>` : ""}
    </div></div>`;
  return html;
}
function setName() { return state.set === ALL ? "All sets" : CONTENT.find(c => c.id === state.set).label; }

function renderQuiz() {
  if (!round) startRound(buildRound(selectedWords(), ROUND_LEN));
  const dirSeg = `<div class="seg" role="group" aria-label="Quiz direction">
      <button data-dir="he-en" aria-pressed="${state.quizDir === "he-en"}">Hebrew → English</button>
      <button data-dir="en-he" aria-pressed="${state.quizDir === "en-he"}">English → Hebrew</button>
    </div>`;
  let html = `<div class="deck-head">${dirSeg}</div>`;
  if (!round) return html + `<div class="card empty muted">No words in this set yet.</div>`;
  if (!round.q) return html + renderQuizDone();
  const n = round.words.length, done = round.i + (round.q.picked !== null ? 1 : 0);
  html += `<div class="progress"><div style="width:${(done / n) * 100}%"></div></div>`;
  html += `<div class="row small muted" style="margin-bottom:8px"><span>Question ${round.i + 1} of ${n}${round.practice ? " · practice" : ""}</span><span class="spacer"></span><span>✅ ${round.right}</span></div>`;
  const { answer, options, picked } = round.q;
  const heToEn = state.quizDir === "he-en";
  html += `<div class="card quiz-q">
      ${heToEn ? heSpan(answer.he, "prompt-he") : `<div class="prompt-en">${esc(answer.mean)}</div>`}
      ${heToEn ? `<div style="margin-top:12px">${hearBtn(answer.he)}</div>` : ""}
    </div>`;
  html += `<div class="opts">` + options.map((o, i) => {
    let cls = "opt" + (heToEn ? "" : " he-opt");
    if (picked !== null) {
      if (o === answer) cls += " right";
      else if (i === picked) cls += " wrong";
    }
    const label = heToEn ? esc(o.mean) : esc(heb(o.he));
    return `<button class="${cls}" data-opt="${i}" ${picked !== null ? "disabled" : ""} ${heToEn ? "" : 'lang="he"'}>${label}</button>`;
  }).join("") + `</div>`;
  if (picked !== null) {
    const ok = options[picked] === answer;
    html += `<div class="feedback">${ok ? "✅ Correct!" : "Not quite."} ${heSpan(answer.he)} <b>${esc(answer.pron)}</b> = ${esc(answer.mean)}</div>`;
    const last = round.i + 1 >= n;
    html += `<div class="row" style="justify-content:center;margin-top:10px">${heToEn ? "" : hearBtn(answer.he)}<button class="btn primary" data-act="next">${last ? "See my score 🎉" : "Next →"}</button></div>`;
  }
  return html;
}

// ---------- All words ----------
const openWords = new Set();
function renderWords() {
  const sets = selectedSets();

// ---------- Alef-Bet ----------
// g: glyph, name, say: Hebrew name for text-to-speech, sound, tip.
const ALEFBET = [
  { g: "א", name: "Alef", say: "אָלֶף", sound: "silent", tip: "Makes no sound. It just holds a vowel, like in אִמָּא." },
  { g: "בּ", name: "Bet", say: "בֵּית", sound: "b", tip: "With a dot inside it's \"b.\"" },
  { g: "ב", name: "Vet", say: "וֵית", sound: "v", tip: "No dot: \"v.\" Look-alike: כ is rounder, with no little tail at the bottom." },
  { g: "ג", name: "Gimel", say: "גִּימֶל", sound: "g", tip: "Always a hard \"g,\" like \"go.\" Look-alike: נ." },
  { g: "ד", name: "Dalet", say: "דָּלֶת", sound: "d", tip: "Look-alike: ר. Dalet has a sharp corner sticking out at the top right." },
  { g: "ה", name: "Hey", say: "הֵא", sound: "h", tip: "Silent at the end of a word, like in תּוֹדָה. Look-alike: ח is closed at the top left; ה has a gap." },
  { g: "ו", name: "Vav", say: "וָו", sound: "v, o, u", tip: "Usually \"v.\" With a dot on top (וֹ) it's \"o.\" With a dot in the middle (וּ) it's \"u.\"" },
  { g: "ז", name: "Zayin", say: "זַיִן", sound: "z", tip: "Look-alike: ו is a plain line. Zayin has a little cap on top." },
  { g: "ח", name: "Chet", say: "חֵית", sound: "ch", tip: "Throaty \"ch,\" like in \"Bach.\" Look-alike: ה has a gap at the top left." },
  { g: "ט", name: "Tet", say: "טֵית", sound: "t", tip: "Sounds just like ת." },
  { g: "י", name: "Yod", say: "יוֹד", sound: "y", tip: "The smallest letter. It floats up high, like an apostrophe. Look-alike: ו goes all the way down." },
  { g: "כּ", name: "Kaf", say: "כַּף", sound: "k", tip: "With a dot inside it's \"k.\"" },
  { g: "כ", name: "Chaf", say: "כַף", sound: "ch", tip: "No dot: throaty \"ch,\" the same sound as ח." },
  { g: "ך", name: "Final Chaf", say: "כַף סוֹפִית", sound: "ch", tip: "How כ looks at the end of a word. It drops below the line." },
  { g: "ל", name: "Lamed", say: "לָמֶד", sound: "l", tip: "The tallest letter. It sticks up above the others." },
  { g: "מ", name: "Mem", say: "מֵם", sound: "m" },
  { g: "ם", name: "Final Mem", say: "מֵם סוֹפִית", sound: "m", tip: "How מ looks at the end of a word, like in שָׁלוֹם. Look-alike: ס is round; ם is square." },
  { g: "נ", name: "Nun", say: "נוּן", sound: "n", tip: "Look-alike: ג has a little foot sticking out to the left." },
  { g: "ן", name: "Final Nun", say: "נוּן סוֹפִית", sound: "n", tip: "How נ looks at the end of a word. Look-alike: ו, but ן drops below the line." },
  { g: "ס", name: "Samech", say: "סָמֶךְ", sound: "s", tip: "Look-alike: ם (Final Mem) is square; ס is round." },
  { g: "ע", name: "Ayin", say: "עַיִן", sound: "silent", tip: "Silent in modern Hebrew, like א. It holds a vowel." },
  { g: "פּ", name: "Pe", say: "פֵּא", sound: "p", tip: "With a dot inside it's \"p.\"" },
  { g: "פ", name: "Fe", say: "פֵא", sound: "f", tip: "No dot: \"f,\" like in סֵפֶר." },
  { g: "ף", name: "Final Fe", say: "פֵא סוֹפִית", sound: "f", tip: "How פ looks at the end of a word." },
  { g: "צ", name: "Tsadi", say: "צָדִי", sound: "ts", tip: "\"ts,\" like the end of \"cats.\"" },
  { g: "ץ", name: "Final Tsadi", say: "צָדִי סוֹפִית", sound: "ts", tip: "How צ looks at the end of a word." },
  { g: "ק", name: "Kuf", say: "קוֹף", sound: "k", tip: "Sounds just like כּ. Its leg drops below the line." },
  { g: "ר", name: "Resh", say: "רֵישׁ", sound: "r", tip: "Look-alike: ד has a sharp corner; ר is smoothly rounded." },
  { g: "שׁ", name: "Shin", say: "שִׁין", sound: "sh", tip: "Dot on the right: \"sh.\"" },
  { g: "שׂ", name: "Sin", say: "שִׂין", sound: "s", tip: "Dot on the left: \"s.\"" },
  { g: "ת", name: "Tav", say: "תָּו", sound: "t", tip: "Always \"t,\" with or without a dot inside." }
];
const LOOKALIKES = [
  ["י ו", "Yod is short and floats up high. Vav goes all the way down."],
  ["ו ז ן", "Vav is a plain line. Zayin has a cap. Final Nun drops below the line."],
  ["ב כ", "Bet has a little tail at the bottom right. Chaf is round."],
  ["ד ר", "Dalet has a sharp corner. Resh is rounded."],
  ["ה ח ת", "Hey has a gap at the top left. Chet is closed. Tav has a foot at the bottom left."],
  ["ג נ", "Gimel has a foot sticking out. Nun is a closed bend."],
  ["ס ם", "Samech is round. Final Mem is square."],
  ["ע צ", "Ayin is like a y with two arms. Tsadi has a flat bottom."]
];
// g: vowel on a placeholder בּ. match: the mark (string) or a pattern (regex) for finding example words.
const VOWEL_LIST = [
  { g: "בָּ", name: "Kamatz", sound: "a", hint: "as in \"father\"", match: "ָ" },
  { g: "בַּ", name: "Patach", sound: "a", hint: "as in \"father\"", match: "ַ" },
  { g: "בֶּ", name: "Segol", sound: "e", hint: "as in \"bed\"", match: "ֶ" },
  { g: "בֵּ", name: "Tsere", sound: "e", hint: "as in \"bed\"", match: "ֵ" },
  { g: "בִּ", name: "Hiriq", sound: "i", hint: "as in \"ski\"", match: "ִ" },
  { g: "בֹּ", name: "Holam", sound: "o", hint: "as in \"go\"", match: /[א-הז-ת][ְ-ׂ]*ֹ/ },
  { g: "בּוֹ", name: "Holam with Vav", sound: "o", hint: "as in \"go\"", match: /וֹ/ },
  { g: "בֻּ", name: "Kubutz", sound: "u", hint: "as in \"tune\"", match: "ֻ" },
  { g: "בּוּ", name: "Shuruk", sound: "u", hint: "as in \"tune\"", match: /וּ(?![ְ-ֻ])/ },
  { g: "בְּ", name: "Shva", sound: "silent or quick e", hint: "usually silent in the middle of a word", match: "ְ" },
  { g: "בֲּ", name: "Hataf Patach", sound: "a", hint: "a quick \"a\"", match: "ֲ" },
  { g: "בֱּ", name: "Hataf Segol", sound: "e", hint: "a quick \"e\"", match: "ֱ" },
  { g: "בֳּ", name: "Hataf Kamatz", sound: "o", hint: "a quick \"o\"", match: "ֳ" }
];
// Dots that aren't regular vowels. examples: words to show (always with marks).
const DOTS = [
  { title: "Dagesh: a dot inside a letter", glyphs: "בּ ב · כּ כ · פּ פ",
    body: "It only changes the sound of three letters: בּ = b but ב = v, כּ = k but כ = ch, פּ = p but פ = f.",
    examples: ["אַבָּא", "כֶּלֶב", "סֵפֶר"] },
  { title: "Dagesh on other letters", glyphs: "דּ מּ שּׁ תּ",
    body: "On every other letter, a dagesh doesn't change the sound, so you can ignore it when reading. דּ is still \"d\" and תּ is still \"t.\"",
    examples: ["יַלְדָּה", "אִמָּא", "אִשָּׁה"] },
  { title: "The Shin/Sin dot", glyphs: "שׁ שׂ",
    body: "Look at the top of ש. Dot on the right is Shin (\"sh\"). Dot on the left is Sin (\"s\").",
    examples: ["שָׁלוֹם", "עֶשֶׂר"] },
  { title: "Dots that make ו a vowel", glyphs: "וֹ וּ",
    body: "A dot on top (וֹ) makes \"o.\" A dot in the middle (וּ) makes \"u.\" These are vowels, and the ו doesn't say \"v.\"",
    examples: ["שָׁלוֹם", "חָתוּל"] },
  { title: "A dot above another letter", glyphs: "לֹ",
    body: "A dot at the top left of a letter (not ש) is Holam, an \"o\" vowel.",
    examples: ["לֹא"] }
];
// Counting forms: the ones used for counting, phone numbers, prices and time.
const NUMBERS = [
  { n: 0, he: "אֶפֶס", pron: "E-fes" },
  { n: 1, he: "אַחַת", pron: "a-CHAT" },
  { n: 2, he: "שְׁתַּיִם", pron: "SHTA-yim" },
  { n: 3, he: "שָׁלוֹשׁ", pron: "sha-LOSH" },
  { n: 4, he: "אַרְבַּע", pron: "AR-ba" },
  { n: 5, he: "חָמֵשׁ", pron: "cha-MESH" },
  { n: 6, he: "שֵׁשׁ", pron: "shesh" },
  { n: 7, he: "שֶׁבַע", pron: "SHE-va" },
  { n: 8, he: "שְׁמוֹנֶה", pron: "shmo-NE" },
  { n: 9, he: "תֵּשַׁע", pron: "TE-sha" },
  { n: 10, he: "עֶשֶׂר", pron: "E-ser" }
];
let abMode = "letters", abSel = null;
// Letters/vowels here always keep their marks, even with "Vowel marks" off.
function rawHe(s, cls = "") { return `<span class="he ${cls}" lang="he" dir="rtl">${esc(s)}</span>`; }
function exampleChips(ws) {
  return ws.slice(0, 6).map(w => `<span class="chip" data-speak="${esc(w.he)}">${heSpan(w.he)} ${esc(w.mean)}</span>`).join("");
}
function renderAlefBet() {
  let html = `<div class="deck-head"><div class="seg" role="group" aria-label="Letters or vowels">
      <button data-ab="letters" aria-pressed="${abMode === "letters"}">Letters</button>
      <button data-ab="vowels" aria-pressed="${abMode === "vowels"}">Vowels</button>
      <button data-ab="dots" aria-pressed="${abMode === "dots"}">Dots</button>
      <button data-ab="numbers" aria-pressed="${abMode === "numbers"}">Numbers</button>
    </div></div>`;
  const words = allWords();

  if (abMode === "dots") {
    html += `<div class="callout"><b>Quick rule:</b> a dot <b>under</b> a letter is a vowel. A dot <b>inside</b> a letter is a dagesh. A dot <b>on top</b> is either the Shin/Sin dot (on ש) or an \"o\" sound.</div>`;
    html += `<div class="card wl">` + DOTS.map(d => `<div class="vowel-row" style="align-items:flex-start">
        <div class="info">
          <div style="font-weight:600">${esc(d.title)}</div>
          <div style="margin:4px 0 6px">${rawHe(d.glyphs, "")}</div>
          <div class="small">${esc(d.body)}</div>
          <div class="ab-ex" style="justify-content:flex-start;margin-top:8px">${d.examples.map(he => {
            const w = words.find(x => x.he === he) || NUMBERS.find(x => x.he === he);
            return `<span class="chip" data-speak="${esc(he)}">${rawHe(he)}${w ? " " + esc(w.mean || String(w.n)) : ""}</span>`;
          }).join("")}</div>
        </div></div>`).join("") + `</div>`;
    return html;
  }

  if (abMode === "numbers") {
    html += `<div class="callout">These are the forms you use for counting, phone numbers and prices. Tap 🔊 to hear each one.</div>`;
    html += `<div class="card wl">` + NUMBERS.map(x => `<div class="wl-item" style="cursor:default">
        <div style="font-size:30px;font-weight:600;min-width:44px;text-align:center;color:var(--accent)">${x.n}</div>
        ${heSpan(x.he)}
        <div class="info"><div class="m">${esc(x.pron)}</div></div>
        <button class="hear" data-speak="${esc(x.he)}" aria-label="Hear ${x.n}">🔊</button>
      </div>`).join("") + `</div>`;
    return html;
  }

  if (abMode === "vowels") {
    html += `<div class="callout">Modern Hebrew has just <b>5 vowel sounds</b>: a, e, i, o, u. Several marks make the same sound, so you only need to learn which sound each one makes.</div>`;
    html += `<div class="card wl">` + VOWEL_LIST.map(v => {
      const ex = words.filter(w => typeof v.match === "string" ? w.he.includes(v.match) : v.match.test(w.he));
      return `<div class="vowel-row">${rawHe(v.g)}<div class="info">
          <div class="m" style="font-weight:500">${esc(v.name)}: <b>${esc(v.sound)}</b></div>
          <div class="small muted">${esc(v.hint)}</div>
          ${ex.length ? `<div class="ab-ex" style="justify-content:flex-start;margin-top:6px">${exampleChips(ex.slice(0, 3))}</div>` : ""}
        </div></div>`;
    }).join("") + `</div>`;
    return html;
  }

  const sel = ALEFBET.find(l => l.g === abSel);
  if (sel) {
    const ex = words.filter(w => breakdown(w.he).some(b => b.name === sel.name));
    html += `<div class="card ab-detail">
      ${rawHe(sel.g, "big")}
      <div class="name">${esc(sel.name)}</div>
      <div class="snd">Sound: <b>${esc(sel.sound)}</b></div>
      ${hearBtn(sel.say)}
      ${sel.tip ? `<div class="tip">${esc(sel.tip)}</div>` : ""}
      ${ex.length ? `<div class="small muted" style="margin-top:12px">In your words:</div><div class="ab-ex">${exampleChips(ex)}</div>` : ""}
    </div>`;
  } else {
    html += `<p class="tap-hint" style="margin:0 4px 12px">Tap a letter to hear its name and learn more. Hebrew reads right to left, so א is first.</p>`;
  }
  html += `<div class="ab-grid">` + ALEFBET.map(l =>
    `<button class="ab-tile" data-letter="${esc(l.g)}" aria-pressed="${l.g === abSel}">${rawHe(l.g)}<span class="ln">${esc(l.name)}</span><span class="ls">${esc(l.sound)}</span></button>`
  ).join("") + `</div>`;
  html += `<div class="group-title" style="margin-top:22px">Look-alikes</div><div class="card wl look">` +
    LOOKALIKES.map(([g, t]) => `<div class="wl-item" style="cursor:default">${rawHe(g)}<div class="info small">${esc(t)}</div></div>`).join("") + `</div>`;
  return html;
}

// ---------- Render + events ----------
const view = document.getElementById("view");
function render() {
  renderHeader();
  view.innerHTML = state.tab === "cards" ? renderCards()
    : state.tab === "sentences" ? renderSentences()
    : state.tab === "quiz" ? renderQuiz()
    : state.tab === "alefbet" ? renderAlefBet()
    : renderWords();
}

view.addEventListener("click", e => {
  const speakEl = e.target.closest("[data-speak]");
  if (speakEl) { e.stopPropagation(); speak(speakEl.dataset.speak); return; }

  const t = e.target.closest("[data-act],[data-mark],[data-filter],[data-reveal],[data-opt],[data-dir],[data-word],[data-ab],[data-letter]");
  if (!t) return;
  const d = t.dataset;

  if (d.ab) { abMode = d.ab; render(); return; }
  if (d.letter) {
    const l = ALEFBET.find(x => x.g === d.letter);
    if (abSel === d.letter) { abSel = null; } else { abSel = d.letter; speak(l.say); }
    render(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  if (d.word) { openWords.has(d.word) ? openWords.delete(d.word) : openWords.add(d.word); render(); return; }
  if (d.filter) { state.cardFilter = d.filter; saveState(); resetDeck(); render(); return; }
  if (d.mark) {
    const w = deck[deckIdx];
    setStatus(w, d.mark);
    deckMarks[deckIdx] = d.mark;
    deckIdx++; flipped = false; render(); return;
  }
  if (d.reveal) { revealed.has(d.reveal) ? revealed.delete(d.reveal) : revealed.add(d.reveal); render(); return; }
  if (d.opt !== undefined) {
    const q = round && round.q;
    if (!q || q.picked !== null) return;
    q.picked = Number(d.opt);
    if (q.options[q.picked] === q.answer) round.right++;
    else if (!round.missed.some(w => sameWord(w, q.answer))) round.missed.push(q.answer);
    render(); return;
  }
  if (d.dir) { state.quizDir = d.dir; saveState(); render(); return; }

  switch (d.act) {
    case "flip": flipped = !flipped; render(); break;
    case "back": if (deckIdx > 0) { deckIdx--; flipped = false; render(); } break;
    case "forward": if (deckIdx < deck.length) { deckIdx++; flipped = false; render(); } break;
    case "shuffle": resetDeck(true); render(); toast("Shuffled"); break;
    case "again": resetDeck(true); render(); break;
    case "next":
      round.i++;
      if (round.i < round.words.length) round.q = makeQuestion(round.words[round.i]);
      else finishRound();
      render(); window.scrollTo(0, 0); break;
    case "newround": startRound(buildRound(selectedWords(), ROUND_LEN)); render(); window.scrollTo(0, 0); break;
    case "practice": startRound(shuffle(round.missed), true); render(); window.scrollTo(0, 0); break;
    case "reset": {
      const label = state.set === ALL ? "all sets" : CONTENT.find(c => c.id === state.set).label;
      if (!confirm(`Reset progress for ${label}?`)) break;
      selectedWords().forEach(w => delete state.progress[key(w.setId, w.id)]);
      saveState(); resetDeck(); render(); break;
    }
  }
});

render();
</script>
</body>
</html>
